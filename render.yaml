services:
  # ─── Backend: FastAPI Web Service ───────────────────────────────────────────
  - type: web
    name: garbhasaathi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: garbhasaathi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # ─── Frontend: React/Vite Static Site ───────────────────────────────────────
  - type: web
    name: garbhasaathi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: garbhasaathi-backend
          type: web
          property: host

# ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: garbhasaathi-db
    databaseName: garbhasaathi
    user: garbhasaathi
    plan: free
